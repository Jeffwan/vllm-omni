# ---------------------------------------------------------------------------
# Step 1: StormService + MooncakeConnector (Multi-Node Omni-Modality)
# ---------------------------------------------------------------------------
#
# This manifest deploys a 3-stage omni-modal pipeline using AIBrix
# StormService with MooncakeConnector as the data plane.
#
#   Role "thinker"  (Stage 0) — Multimodal understanding + text generation
#   Role "talker"   (Stage 1) — Text embeddings → audio codec codes
#   Role "code2wav" (Stage 2) — Audio codec codes → audio waveform
#
# Each role runs on its own node, communicating via Mooncake (TCP/RDMA).
#
# Prerequisites:
#   1. AIBrix operator installed (v0.4.0+)
#   2. Mooncake master service running (see mooncake-master Deployment below)
#   3. Kubernetes cluster with GPU nodes
#   4. pip install mooncake-transfer-engine (baked into container image)
#
# Deploy:
#   kubectl apply -f stormservice_qwen2_5_omni_mooncake.yaml
# ---------------------------------------------------------------------------

# ===========================================================================
# 1. Mooncake Master — centralized metadata + control plane
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mooncake-master
  labels:
    app: mooncake-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mooncake-master
  template:
    metadata:
      labels:
        app: mooncake-master
    spec:
      containers:
        - name: mooncake-master
          image: kvcache-ai/mooncake:latest
          command: ["mooncake_master"]
          args:
            - "--rpc_port=50051"
            - "--enable_http_metadata_server=true"
            - "--http_metadata_server_host=0.0.0.0"
            - "--http_metadata_server_port=8080"
            - "--metrics_port=9003"
            - "--root_fs_dir=/data/mc_storage/"
            - "--cluster_id=omni-cluster-1"
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 8080
              name: metadata
            - containerPort: 9003
              name: metrics
          volumeMounts:
            - name: mc-storage
              mountPath: /data/mc_storage
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: mc-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mooncake-master
spec:
  selector:
    app: mooncake-master
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
    - port: 8080
      targetPort: 8080
      name: metadata
  type: ClusterIP

# ===========================================================================
# 2. StormService — 3-role omni-modality pipeline
# ===========================================================================
---
apiVersion: orchestration.aibrix.ai/v1alpha1
kind: StormService
metadata:
  name: qwen25-omni-mooncake
  labels:
    model.aibrix.ai/name: "Qwen2.5-Omni-7B"
    model.aibrix.ai/engine: "vllm-omni"
spec:
  # Pooled mode: each role scales independently
  replicas: 1
  stateful: true
  updateStrategy:
    type: InPlaceUpdate
  selector:
    matchLabels:
      app: qwen25-omni-mooncake
  template:
    metadata:
      labels:
        app: qwen25-omni-mooncake
        model.aibrix.ai/name: "Qwen2.5-Omni-7B"
    spec:
      # RoleSet update strategy: update roles one at a time
      # (thinker first, then talker, then code2wav)
      updateStrategy: Sequential

      roles:
        # ---------------------------------------------------------------
        # Role 0: Thinker
        # ---------------------------------------------------------------
        - name: thinker
          replicas: 1
          stateful: true
          upgradeOrder: 0
          template:
            metadata:
              labels:
                model.aibrix.ai/port: "8000"
                model.aibrix.ai/engine: "vllm-omni"
                omni.vllm.ai/stage-id: "0"
                omni.vllm.ai/stage-role: "thinker"
            spec:
              # Anti-affinity: spread stages across nodes
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        labelSelector:
                          matchExpressions:
                            - key: app
                              operator: In
                              values: ["qwen25-omni-mooncake"]
                        topologyKey: kubernetes.io/hostname
              containers:
                - name: vllm-omni-thinker
                  image: vllm-omni/vllm-omni:latest
                  command: ["python", "-m", "vllm_omni.entrypoints.stage_service"]
                  args:
                    - "--model=Qwen/Qwen2.5-Omni-7B"
                    - "--stage-id=0"
                    - "--stage-type=llm"
                    - "--model-stage=thinker"
                    - "--model-arch=Qwen2_5OmniForConditionalGeneration"
                    - "--gpu-memory-utilization=0.8"
                    - "--enforce-eager"
                    - "--trust-remote-code"
                    - "--engine-output-type=latent"
                    - "--port=8000"
                    # Mooncake connector config
                    - "--connector-type=MooncakeConnector"
                    - "--connector-metadata-server=http://mooncake-master:8080/metadata"
                    - "--connector-master=mooncake-master:50051"
                    - "--connector-proto=tcp"
                  env:
                    - name: CUDA_VISIBLE_DEVICES
                      value: "0"
                    - name: VLLM_LOGGING_PREFIX
                      value: "[Stage-0-Thinker]"
                    # Mooncake needs to know this pod's IP for registration
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                  ports:
                    - containerPort: 8000
                      name: http
                  resources:
                    limits:
                      nvidia.com/gpu: "1"
                    requests:
                      nvidia.com/gpu: "1"
                      cpu: "4"
                      memory: "32Gi"
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8000
                    initialDelaySeconds: 120
                    periodSeconds: 10
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]

        # ---------------------------------------------------------------
        # Role 1: Talker
        # ---------------------------------------------------------------
        - name: talker
          replicas: 1
          stateful: true
          upgradeOrder: 1
          template:
            metadata:
              labels:
                model.aibrix.ai/port: "8001"
                model.aibrix.ai/engine: "vllm-omni"
                omni.vllm.ai/stage-id: "1"
                omni.vllm.ai/stage-role: "talker"
            spec:
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        labelSelector:
                          matchExpressions:
                            - key: app
                              operator: In
                              values: ["qwen25-omni-mooncake"]
                        topologyKey: kubernetes.io/hostname
              containers:
                - name: vllm-omni-talker
                  image: vllm-omni/vllm-omni:latest
                  command: ["python", "-m", "vllm_omni.entrypoints.stage_service"]
                  args:
                    - "--model=Qwen/Qwen2.5-Omni-7B"
                    - "--stage-id=1"
                    - "--stage-type=llm"
                    - "--model-stage=talker"
                    - "--model-arch=Qwen2_5OmniForConditionalGeneration"
                    - "--gpu-memory-utilization=0.8"
                    - "--enforce-eager"
                    - "--trust-remote-code"
                    - "--engine-output-type=latent"
                    - "--engine-input-source=0"
                    - "--port=8001"
                    - "--connector-type=MooncakeConnector"
                    - "--connector-metadata-server=http://mooncake-master:8080/metadata"
                    - "--connector-master=mooncake-master:50051"
                    - "--connector-proto=tcp"
                  env:
                    - name: CUDA_VISIBLE_DEVICES
                      value: "0"
                    - name: VLLM_LOGGING_PREFIX
                      value: "[Stage-1-Talker]"
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                  ports:
                    - containerPort: 8001
                      name: http
                  resources:
                    limits:
                      nvidia.com/gpu: "1"
                    requests:
                      nvidia.com/gpu: "1"
                      cpu: "4"
                      memory: "32Gi"
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8001
                    initialDelaySeconds: 120
                    periodSeconds: 10
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]

        # ---------------------------------------------------------------
        # Role 2: Code2Wav
        # ---------------------------------------------------------------
        - name: code2wav
          replicas: 1
          stateful: true
          upgradeOrder: 2
          template:
            metadata:
              labels:
                model.aibrix.ai/port: "8002"
                model.aibrix.ai/engine: "vllm-omni"
                omni.vllm.ai/stage-id: "2"
                omni.vllm.ai/stage-role: "code2wav"
            spec:
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        labelSelector:
                          matchExpressions:
                            - key: app
                              operator: In
                              values: ["qwen25-omni-mooncake"]
                        topologyKey: kubernetes.io/hostname
              containers:
                - name: vllm-omni-code2wav
                  image: vllm-omni/vllm-omni:latest
                  command: ["python", "-m", "vllm_omni.entrypoints.stage_service"]
                  args:
                    - "--model=Qwen/Qwen2.5-Omni-7B"
                    - "--stage-id=2"
                    - "--stage-type=llm"
                    - "--model-stage=code2wav"
                    - "--model-arch=Qwen2_5OmniForConditionalGeneration"
                    - "--gpu-memory-utilization=0.3"
                    - "--enforce-eager"
                    - "--trust-remote-code"
                    - "--engine-output-type=audio"
                    - "--engine-input-source=1"
                    - "--port=8002"
                    - "--connector-type=MooncakeConnector"
                    - "--connector-metadata-server=http://mooncake-master:8080/metadata"
                    - "--connector-master=mooncake-master:50051"
                    - "--connector-proto=tcp"
                  env:
                    - name: CUDA_VISIBLE_DEVICES
                      value: "0"
                    - name: VLLM_LOGGING_PREFIX
                      value: "[Stage-2-Code2Wav]"
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                  ports:
                    - containerPort: 8002
                      name: http
                  resources:
                    limits:
                      nvidia.com/gpu: "1"
                    requests:
                      nvidia.com/gpu: "1"
                      cpu: "4"
                      memory: "16Gi"
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8002
                    initialDelaySeconds: 120
                    periodSeconds: 10
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]

# ===========================================================================
# 3. OmniRouter — ingress service that routes to Stage 0 (Thinker)
# ===========================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: omni-router
  labels:
    app: omni-router
spec:
  selector:
    omni.vllm.ai/stage-role: thinker
  ports:
    - port: 8080
      targetPort: 8000
      name: http
  type: LoadBalancer
